# V2 Development Docker Compose
# PostgreSQL + Redis for V2 development
# Does NOT modify the existing docker-compose.yml (MySQL)
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#
# To stop:
#   docker-compose -f docker-compose.dev.yml down
#
# To reset data:
#   docker-compose -f docker-compose.dev.yml down -v

version: "3.7"

services:
  # PostgreSQL database for V2
  postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_USER: "${DB_USERNAME:-vulum}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-vulum_dev}"
      POSTGRES_DB: "${DB_DATABASE:-vulum_dev}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - "v2postgres:/var/lib/postgresql/data"
    networks:
      - v2backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vulum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (shared with V1 if needed)
  redis:
    image: "redis:alpine"
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - "v2redis:/data"
    networks:
      - v2backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # MailHog for email testing (shared with V1 if needed)
  mailhog:
    image: "mailhog/mailhog:latest"
    ports:
      - "${FORWARD_MAILHOG_PORT:-1025}:1025"
      - "${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025"
    networks:
      - v2backend

networks:
  v2backend:
    driver: bridge

volumes:
  v2postgres:
    driver: local
  v2redis:
    driver: local
